name: Deploy Application

on:
  # Despliegue automático al hacer push
  push:
    branches:
      - main

  # Despliegue manual (permite elegir rama, commit o tag)
  workflow_dispatch:
    inputs:
      target_ref:
        description: 'Rama, Tag o Commit SHA a desplegar'
        required: true
        default: 'main'
      environment:
        description: 'Entorno de destino'
        type: choice
        options:
          - production
          - staging
        default: 'production'
discrete_step:
        description: 'Motivo del despliegue / Rollback'
        required: false
        default: 'Manual trigger or Rollback'

jobs:
  deploy:
    runs-on: self-hosted # Tu agente detrás del firewall

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
        with:
          # Si se dispara manualmente usa el input, si es automático usa la rama del push
          ref: ${{ github.event.inputs.target_ref || github.ref }}

      - name: Desplegar aplicación
        run: |
          echo "Desplegando la versión: ${{ github.event.inputs.target_ref || github.ref }}" >> app.log
          # Aquí van tus comandos de despliegue (docker compose up, systemctl restart, etc.) 