name: Deploy Application

on:
  # Despliegue automático al hacer push
  push:
    branches:
      - main

  # Despliegue manual (permite elegir rama, commit o tag)
  workflow_dispatch:
    inputs:
      target_ref:
        description: 'Rama, Tag o Commit SHA a desplegar'
        required: true
        default: 'main'
      environment:
        type: choice
        description: 'Entorno de destino'
        options:
          - production
          - staging
        default: 'production'
      reason:
        description: 'Motivo del despliegue / Rollback'
        required: false
        default: 'Manual trigger or Rollback'

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.target_ref || github.ref }}

      - name: Desplegar aplicación
        run: |
          echo "Desplegando versión: ${{ github.event.inputs.target_ref || github.ref }}" >> app.log
          echo "Motivo: ${{ github.event.inputs.reason }}" >> app.log